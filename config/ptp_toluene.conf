# p-terphenyl (pTP) dissolved in toluene, airbrush-sprayed along the 120x120 mm
# serpentine raster (12 mm pitch) used for the IFIC acrylic samples.
#
# Used by analysis/fit_ptp_efficiency.py (which reads it directly) and runnable
# on its own with ./main.sh ptp_toluene.
#
# Solution: 45 mg pTP in 7.5 mL toluene (6 g/L) -> volume fraction of solids
# 6 / 1230 = 0.0049 (pTP crystal density 1.23 g/cm^3). The airbrush settings
# below are typical values, not measured ones; the coating-model fit only uses
# the *shape* of the simulated thickness map, not its absolute scale.

# --- Material (sprayed liquid) ---
MATERIAL=toluene
DENSITY=
VISCOSITY=
SOLIDS_FRACTION=0.0049

# --- Path (G-code toolpath) ---
GCODE=examples/raster_120mm_pitch12.gcode   # 120x120 mm, 12 mm pitch, F3000, closed loop
FEED=
STANDOFF_MM=150

# --- Hydraulics (airbrush-like: small orifice, ~2 bar) ---
PRESSURE_BAR=2.0
ORIFICE_MM=0.35
NOZZLE_SHAPE=hollow_cone
SPRAY_DURATION=0.15          # ignored when GCODE is set

# --- Droplet size distribution (airbrush mist, ~40 um median diameter) ---
DISTRIBUTION=lognormal
MEAN_RADIUS_MM=0.02
RADIUS_STD_MM=0.01

# --- Physics ---
DRAG_MODEL=clift_gauvin

# --- Geometry / integration ---
CONE=15.0
HEIGHT=1.5                   # ignored for path runs (STANDOFF_MM sets the height)
SPEED_SPREAD=0.15
DT=0.002
SEED=42

# --- Output (written to output/<RUN_NAME>/; empty RUN_NAME -> output/tmp/) ---
RUN_NAME=
OUT=ptp_toluene.png
NO_PLOT=false
DATA=ptp_toluene.npz
NO_DATA=false

# Pin the droplet count: the derived count for a 6 g/L mist is ~1e8 per pass,
# far beyond what needs integrating to map the macroscopic coating shape.
DROPLETS=400000

# --- Sample / fit geometry (analysis/fit_ptp_efficiency.py only) ---
SAMPLE_MM=74                 # square acrylic sample edge, centred on the raster
